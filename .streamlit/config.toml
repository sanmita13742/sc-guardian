[theme]
base = "dark"
primaryColor = "#2563eb"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
borderColor = "#30363d"
font = "sans serif"

# Semantic severity colors (distinct from primary brand blue)
redColor = "#f85149"
orangeColor = "#f0883e"
yellowColor = "#d29922"
blueColor = "#58a6ff"
greenColor = "#3fb950"
grayColor = "#8b949e"

# Chart categorical palette aligned with security severity tiers
chartCategoricalColors = [
    "#f85149",
    "#f0883e",
    "#d29922",
    "#58a6ff",
    "#8b949e",
    "#3fb950",
    "#bc8cff"
]

[client]
showErrorDetails = true
toolbarMode = "minimal"

[server]
headless = true
